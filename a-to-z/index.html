<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alldotz · Four steps animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,300,0..1,0&display=block" rel="stylesheet">
<style>
:root{
  --navy:#0C0143; --yellow:#FEF600; --lightblue:#5DC7FF; --paper:#F9F9F9; --white:#fff; --mist:#EDEDF1; --red:#F97066;
  --ink:#0C0143; --ink-muted:rgba(12,1,67,.65); --ink-line:rgba(12,1,67,.2);
  --text:#F9F9F9; --muted:rgba(249,249,249,.65); --half:rgba(249,249,249,.5);
  --rule:rgba(249,249,249,.12);            /* lines on the dark window */
  --surface:rgba(249,249,249,.1);          /* every panel on the dark window */
  --label-bg:rgba(93,199,255,.16);         /* every tag / label */
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.ms{font-family:"Material Symbols Rounded";font-weight:300;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:"liga";display:inline-block}
.still *{transition:none!important}

/* ---------- section ---------- */
.section{padding:48px;overflow-x:clip}
.panel{position:relative;max-width:1344px;margin:0 auto;border-radius:24px;padding:64px;background:linear-gradient(180deg,#5DC7FF 0%,#B8E4FB 55%,#F3F6FA 100%)}
.dot{position:absolute;width:10px;height:10px;border-radius:2px;background:var(--navy)}
.dot.tl{left:24px;top:24px}.dot.tr{right:24px;top:24px}.dot.bl{left:24px;bottom:24px}.dot.br{right:24px;bottom:24px}
.body{position:relative;display:grid;grid-template-columns:clamp(300px,29vw,420px) minmax(0,1fr);gap:32px;align-items:start}

/* ---------- step cards ---------- */
.steps{display:flex;flex-direction:column;gap:12px}
.step{all:unset;box-sizing:border-box;position:relative;display:flex;gap:16px;align-items:flex-start;padding:20px;border-radius:16px;background:var(--paper);border:1px solid var(--ink-line);cursor:pointer;transition:background .25s,border-color .25s}
.step:hover{border-color:rgba(12,1,67,.45)}
.step:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.step.act{background:var(--white);border-color:var(--navy)}
.bw{position:relative;flex:none;width:32px;height:32px}
.badge{width:100%;height:100%;border-radius:8px;display:grid;place-items:center;font:500 12px/1 var(--font-mono);background:var(--mist);border:1px solid var(--ink-line);color:var(--ink-muted);transition:.25s}
.badge .ms{font-size:16px}
.step.act .badge{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.step.done .badge{background:var(--navy);border-color:var(--navy);color:var(--paper)}
/* timer: a progress line runs clockwise around the active badge */
.ring-t{position:absolute;left:-4px;top:-4px;width:calc(100% + 8px);height:calc(100% + 8px);overflow:visible;opacity:0;transition:opacity .25s}
.ring-t path{fill:none;stroke-width:1.5;stroke-linecap:round}
.ring-t .trk{stroke:rgba(12,1,67,.2)}
.ring-t .prg{stroke:var(--navy);stroke-dasharray:100;stroke-dashoffset:100}
.step.act .ring-t{opacity:1}
.step .tx{display:flex;flex-direction:column;gap:4px;padding-top:4px;min-width:0}
.step .t{font:500 16px/1.5 var(--font-body);color:var(--ink-muted);transition:color .25s}
.step .s{font:400 14px/1.5 var(--font-body);color:var(--ink-muted)}
.step.act .t{color:var(--ink)}

/* ---------- window ---------- */
.win{container:win/inline-size;background:var(--navy);border-radius:16px;display:flex;flex-direction:column;min-height:686px;overflow:hidden;color:var(--text)}
.bar-w{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--rule);min-height:48px}
.bar-w .dots{display:flex;gap:6px;flex:none}
.bar-w .dots i{width:8px;height:8px;border-radius:50%;background:var(--paper)}
.bar-w .nm{font:400 14px/1.2 var(--font-mono);color:var(--text);margin-left:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label{display:inline-flex;align-items:center;gap:6px;background:var(--label-bg);color:var(--lightblue);border-radius:999px;padding:4px 12px;font:500 12px/1.5 var(--font-body);white-space:nowrap;transition:background .3s,color .3s,opacity .45s,transform .45s}
.label .ms{font-size:14px}
.state{flex:none}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.state.neutral{background:var(--surface);color:var(--muted)}
.state.bad{background:rgba(249,112,102,.16);color:var(--red)}
.cv{position:relative;flex:1;display:flex;flex-direction:column;padding:40px}
.scene{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center}
svg.bows{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.bow path{fill:none;stroke-width:1.3;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.bow rect{fill:var(--paper)}
.bow{opacity:0;transition:opacity .3s}.bow.on{opacity:1}

/* scene atoms */
.rv{opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}.rv.on{opacity:1;transform:none}
.surface{background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.node{position:relative;display:flex;align-items:center;gap:10px;background:var(--white);color:var(--ink);border-radius:12px;padding:0 12px 0 10px;min-width:0;box-shadow:0 0 0 0 transparent;transition:box-shadow .3s,opacity .45s,transform .45s}
.node .tile{width:32px;height:32px;flex:none;border-radius:8px;background:var(--yellow);display:grid;place-items:center}
.node .tile .ms{font-size:18px;color:var(--ink)}
.node b{display:block;font:500 14px/1.5 var(--font-body);white-space:nowrap}
.node i{display:block;font:400 12px/1.2 var(--font-mono);font-style:normal;color:var(--ink-muted);white-space:nowrap}
.node.ok{box-shadow:0 0 0 2px var(--lightblue)}
.node.bad{box-shadow:0 0 0 2px var(--red)}
.flag{position:absolute;top:-9px;right:8px;font:500 11px/1 var(--font-mono);background:var(--red);color:var(--navy);border-radius:999px;padding:4px 8px;opacity:0;transition:opacity .3s,background .3s;white-space:nowrap}
.flag.on{opacity:1}.flag.good{background:var(--lightblue)}
.ybtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:2px;background:var(--yellow);color:var(--ink);font:600 14px/1 var(--font-body);white-space:nowrap;transition:transform .15s,opacity .45s;flex:none}
.ybtn .ms{font-size:18px;font-variation-settings:"FILL" 1}
.ybtn.pressed{transform:scale(.94)}
.ybtn.rv.on.pressed{transform:scale(.94)}
.caret::after{content:"";display:inline-block;width:1px;height:14px;background:currentColor;margin-left:1px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.labels{display:flex;gap:8px;flex-wrap:wrap}

/* step 1 · build: the hero flow, centred */
.build{width:360px;max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.msg{border-radius:12px 12px 0 12px;padding:12px 14px;font:400 14px/1.5 var(--font-body);color:var(--text);min-height:68px}
.vflow{display:flex;flex-direction:column;gap:18px}
.vflow .node{height:55px}
.vflow .pair{display:flex;gap:10px}.vflow .pair .node{flex:1 1 0}
.build .labels{justify-content:center;align-self:center;width:max-content;max-width:calc(100cqw - 26px)}

/* steps 2 and 4: a row of four cards, bows under-over-under */
.flow{position:relative;display:flex;justify-content:space-between;width:100%;max-width:681px;margin:0 auto;padding:68px 0}
.flow .node{flex:0 1 126px;min-width:110px;height:44px;padding:0 10px 0 8px}
.flow .node .tile{width:28px;height:28px}.flow .node .tile .ms{font-size:16px}

/* step 2 · test */
.s-test{justify-content:flex-start}
.s-test .flow{margin:auto}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;width:max-content}
.seg .slab{position:absolute;left:4px;top:4px;bottom:4px;width:calc(50% - 4px);background:var(--white);border-radius:8px;transition:transform .45s cubic-bezier(.45,.05,.25,1)}
.seg.right .slab{transform:translateX(100%)}
.seg .o{position:relative;z-index:1;min-width:160px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;transition:color .2s .2s}
.seg .o b{font:500 13px/1.5 var(--font-body)}
.seg .o span{font:400 12px/1.5 var(--font-body);opacity:.65}
.seg .o.on{color:var(--ink)}
.tpanel{margin-top:0}
.phead{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:20px;font:400 12px/1.5 var(--font-body);color:var(--muted)}
.tabs span{position:relative;padding:13px 0}
.tabs .act{color:var(--text);font-weight:500}
.tabs .act::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--yellow)}
.sv{margin-left:auto;display:flex}
.pbody{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:16px 16px 18px;align-items:start}
.ch{display:block;font:400 12px/1.5 var(--font-body);color:var(--half);margin-bottom:10px}
.code{font:400 13px/1.65 var(--font-mono)}
.code span{color:var(--muted)}
.inp{height:40px;display:flex;align-items:center;border:1px solid var(--yellow);border-radius:8px;padding:0 12px;font:400 13px/1 var(--font-mono);background:rgba(249,249,249,.04)}
.dd{margin-top:6px;background:#231D58;border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(12,1,67,.55);padding:4px;font:400 12px/1.4 var(--font-mono);opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.dd.open{opacity:1;transform:none}
.dd div{padding:7px 8px;border-radius:6px}
.dd div:first-child{background:rgba(249,249,249,.08)}
.dd span{color:var(--muted)}

/* step 3 · govern */
.govern{display:flex;flex-direction:column;align-items:center}
.score{position:relative;width:112px;height:112px}
.score svg{display:block;width:100%;height:100%}
.score .fg{transition:stroke-dashoffset .6s}
.score b{position:absolute;inset:0;display:grid;place-items:center;font:500 15px/1 var(--font-mono);letter-spacing:.04em}
.rules{width:360px;max-width:100%;display:flex;flex-direction:column;gap:8px;margin-top:20px}
.rule{display:flex;align-items:center;gap:12px;padding:12px 14px;transition:border-color .3s,opacity .45s,transform .45s}
.rule .ck{width:24px;height:24px;flex:none;border-radius:6px;border:1px solid var(--rule);display:grid;place-items:center;color:var(--navy);transition:.3s}
.rule .ck .ms{font-size:16px;opacity:0;transition:opacity .2s}
.rule.chk .ck{background:var(--lightblue);border-color:var(--lightblue)}
.rule.chk .ck .ms,.rule.bad .ck .ms{opacity:1}
.rule.bad{border-color:rgba(249,112,102,.7)}
.rule.bad .ck{background:var(--red);border-color:var(--red)}
.rule .rt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rule .tt{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.rule .tt b{font:500 14px/1.5 var(--font-body)}
.rule .tt .label{font-size:11px;padding:1px 8px}
.rule .sg{font:400 12px/1.5 var(--font-body);color:var(--muted)}
.rule .ybtn{height:28px;padding:0 12px;font-size:13px}
.golive{margin-top:24px}

/* step 4 · self-healing */
.bubble{margin-top:16px;padding:14px 16px;font:400 13px/1.55 var(--font-body)}
.bubble .who{display:flex;align-items:center;gap:6px;font:500 13px/1.5 var(--font-body);margin-bottom:6px}
.bubble .who .ms{font-size:16px;color:var(--yellow);font-variation-settings:"FILL" 1}
.bubble p{margin:0 0 6px;min-height:20px}
.bubble .ybtn{margin-top:10px}
.trace{margin-top:12px;padding:14px 16px}
.trace .ch{margin-bottom:10px}
.tr{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:center;font:400 12px/1.4 var(--font-mono);margin-bottom:6px}
.tr:last-child{margin-bottom:0}
.tb{position:relative;height:10px;border-radius:3px;background:rgba(249,249,249,.08)}
.tb i{position:absolute;top:0;height:100%;width:0;border-radius:3px;transition:width .6s}
.tb i.g{background:var(--lightblue)}.tb i.r{background:var(--red)}
.heal .labels{margin-top:12px}

/* ---------- narrow window (container query): everything goes vertical ---------- */
@container win (max-width:599px){
  .bar-w{padding:10px 8px 10px 12px}
  .bar-w .nm{font-size:12px;margin-left:4px}
  .cv{padding:16px 13px 20px}
  .build{width:min(236px,100% - 72px);gap:24px}
  .vflow{gap:12px}
  .vflow .node{height:51px;padding:0 10px 0 8px;gap:8px}
  .vflow .node .tile{width:28px;height:28px}.vflow .node .tile .ms{font-size:16px}
  .vflow .pair .node{height:auto;min-height:65px;padding-top:8px;padding-bottom:8px}
  .vflow .pair .node b,.vflow .pair .node i{white-space:normal}
  .flow{flex-direction:column;justify-content:flex-start;gap:18px;max-width:min(248px,100% - 72px);padding:4px 0}
  .flow .node{flex:none;width:100%}
  .s-test .flow{margin:24px auto}
  .toprow{flex-direction:column;align-items:flex-start;gap:12px}
  .seg{width:100%}
  .seg .o{min-width:0;padding:10px}
  .seg .o span{font-size:11px}
  .toprow .ybtn{height:32px;font-size:12px;padding:0 14px}
  .phead{flex-wrap:wrap}
  .sv{order:-1;flex-basis:100%;margin:0;padding-top:16px}
  .pbody{grid-template-columns:1fr;gap:20px}
  .score{width:68px;height:68px}
  .score b{font-size:12px}
  .rules{width:100%;gap:4px;margin-top:16px}
  .rule .tt{flex-direction:column-reverse;align-items:flex-start;gap:8px}
  .golive{margin-top:20px}
  .golive.ybtn{font-size:12px}
  .bubble{margin-top:16px}
  .trace{padding:14px}
}

@container win (max-width:299px){.vflow .pair .node .tile{display:none}.vflow .pair .node{padding-left:12px}}

/* cursor */
#cur{position:absolute;left:0;top:0;width:0;height:0;z-index:20;pointer-events:none;opacity:0;transform:translate(600px,320px);transition:transform .8s cubic-bezier(.45,.05,.25,1),opacity .3s}
#cur.vis{opacity:1}
#cur svg{position:absolute;left:-1px;top:-1px;display:block;filter:drop-shadow(0 2px 3px rgba(12,1,67,.35));transition:transform .12s}
#cur.down svg{transform:scale(.88);transform-origin:1px 1px}
/* hover: arrow becomes a pointing hand over anything clickable (hotspot = fingertip) */
#cur svg.hand{left:-11.4px;top:-2.75px;display:none}
#cur.down svg.hand{transform-origin:11.4px 2.75px}
#cur.hand svg.arrow{display:none}#cur.hand svg.hand{display:block}
#cur .rip{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--yellow);opacity:0}
#cur.click .rip{animation:rip .55s ease-out}
@keyframes rip{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(1.9)}}

/* prototype controls (not part of the design) */
.demo{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;gap:6px;font:500 12px/1 var(--font-body)}
.demo button{all:unset;cursor:pointer;background:var(--navy);color:var(--paper);border-radius:999px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px}
.demo button:focus-visible{outline:2px solid var(--lightblue);outline-offset:2px}
.demo .ms{font-size:16px}

/* ---------- page breakpoints ---------- */
@media (max-width:1199px){
  .section{padding:32px}
  .panel{padding:56px 40px 40px}
  .body{grid-template-columns:1fr}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .step{align-items:center}
  .step .tx{padding-top:0}
  .step .s{display:none}
  .step.act .s{display:block}
  .win{min-height:640px}
}
@media (max-width:699px){
  .section{padding:12px}
  .panel{padding:40px 12px;border-radius:16px}
  .dot.tl,.dot.tr{top:10px}.dot.bl,.dot.br{bottom:10px}.dot.tl,.dot.bl{left:10px}.dot.tr,.dot.br{right:10px}
  .body{gap:24px}
  .steps{grid-template-columns:1fr;gap:8px}
  .step{padding:14px;gap:12px;border-radius:12px;align-items:center}
  .step.act{align-items:flex-start}
  .bw{width:28px;height:28px}
  .step .tx{padding-top:0;gap:2px}
  .step.act .tx{padding-top:2px}
  .win{min-height:0;border-radius:12px}
}
@media (prefers-reduced-motion:reduce){#cur{display:none}}
</style>
</head>
<body>
<section class="section">
  <div class="panel">
    <span class="dot tl"></span><span class="dot tr"></span><span class="dot bl"></span><span class="dot br"></span>
    <div class="body" id="demo">
      <div class="steps" id="steps" role="tablist" aria-label="Four steps"></div>
      <div class="win" aria-label="Animated demo of Alldotz">
        <div class="bar-w"><span class="dots"><i></i><i></i><i></i></span><span class="nm" id="nm">deal-to-jira-slack</span><span class="label state neutral" id="state">Draft</span></div>
        <div class="cv" id="cv"><svg class="bows" id="bows" aria-hidden="true"></svg><div class="scene" id="scene"></div></div>
      </div>
      <div id="cur" aria-hidden="true"><span class="rip"></span><svg class="arrow" width="20" height="26" viewBox="0 0 20 26"><path d="M1.5 1.5v19.2l5-4.6 3.2 7.6 3.3-1.4-3.2-7.4h6.9z" fill="#0C0143" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><svg class="hand" width="29" height="34" viewBox="0 0 29 34"><path d="M9.625 16.1V4.5C9.625 4.036 9.809 3.591 10.138 3.263C10.466 2.934 10.911 2.75 11.375 2.75C11.839 2.75 12.284 2.934 12.613 3.263C12.941 3.591 13.125 4.036 13.125 4.5V11.9V10.6C13.125 10.136 13.309 9.691 13.638 9.363C13.966 9.034 14.411 8.85 14.875 8.85C15.339 8.85 15.784 9.034 16.113 9.363C16.441 9.691 16.625 10.136 16.625 10.6V12.3V11.5C16.625 11.036 16.809 10.591 17.138 10.263C17.466 9.934 17.911 9.75 18.375 9.75C18.839 9.75 19.284 9.934 19.613 10.263C19.941 10.591 20.125 11.036 20.125 11.5V13.3V12.9C20.125 12.436 20.309 11.991 20.638 11.663C20.966 11.334 21.411 11.15 21.875 11.15C22.339 11.15 22.784 11.334 23.113 11.663C23.441 11.991 23.625 12.436 23.625 12.9V19.1C23.625 23.4 20.925 26.4 16.825 26.4H14.225C11.925 26.4 10.425 25.4 9.225 23.8L5.025 18.5C4.802 18.144 4.71 17.722 4.766 17.306C4.821 16.89 5.021 16.506 5.329 16.221C5.638 15.936 6.036 15.768 6.455 15.746C6.874 15.724 7.288 15.849 7.625 16.1L9.625 18.1V16.1Z" fill="#fff" stroke="#0C0143" stroke-width="1.5" stroke-linejoin="round"/><path d="M13.125 11.898V16.098M16.625 12.298V16.098M20.125 13.298V16.098" stroke="#0C0143" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    </div>
  </div>
</section>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEF600"/><stop offset=".35" stop-color="#FFFFFF"/><stop offset=".65" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FEF600"/></linearGradient>
  <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEF600"/><stop offset=".7" stop-color="#FFFFFF"/></linearGradient>
  <linearGradient id="gU" x1="0" y1="0" x2="0" y2="1"><stop offset=".3" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FEF600"/></linearGradient>
</defs></svg>

<div class="demo" aria-label="Prototype controls">
  <button type="button" id="pp"><span class="ms" aria-hidden="true" id="ppI">pause</span><span id="ppT">Pause</span></button>
</div>

<script>
(function(){
'use strict';
var TXT_BUILD='When a deal closes in Salesforce, create a Jira ticket and tell #sales on Slack';
var STILL=parseInt(new URLSearchParams(location.search).get('still')||'0',10); /* ?still=1..4 shows the end state of one step */
var REDUCED=!!STILL||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
if(STILL)document.documentElement.classList.add('still');
var $=function(s){return document.querySelector(s)};
var demo=$('#demo'),cv=$('#cv'),scene=$('#scene'),bowsSvg=$('#bows'),cur=$('#cur'),stateEl=$('#state'),stepsEl=$('#steps'),pp=$('#pp');
var timers=[],idx=-1,paused=false;
function at(ms,fn){if(REDUCED){fn();return}timers.push(setTimeout(fn,ms))} /* reduced/still: apply every step at once, in order */
function clearAll(){timers.forEach(clearTimeout);timers=[]}
function q(s){return scene.querySelector(s)}
function qa(s){return scene.querySelectorAll(s)}
function A(n){return '[data-a="'+n+'"]'}
function on(n,ms){at(ms,function(){qa(A(n)).forEach(function(e){e.classList.add('on')})})}
function cls(n,c,ms,rm){at(ms,function(){qa(A(n)).forEach(function(e){e.classList[rm?'remove':'add'](c)})})}
function setState(t,c,ms){at(ms||0,function(){stateEl.textContent=t;stateEl.className='label state '+(c||'neutral')})}
function typeInto(sel,text,start,per,each){
  for(var i=0;i<text.length;i++){(function(k){at(start+k*per,function(){var e=q(sel);if(e)e.textContent=text.slice(0,k+1);if(each)each(k)})})(i)}
}
function endCaret(sel,ms){at(ms,function(){var e=q(sel);if(e)e.classList.remove('caret')})}
var handT;
function hand(v){clearTimeout(handT);cur.classList.toggle('hand',!!v)}
function moveTo(el){
  if(REDUCED||!el)return;
  hand(false);handT=setTimeout(function(){hand(true)},550); /* arrow while travelling, hand once it rests on the target */
  var d=demo.getBoundingClientRect(),r=el.getBoundingClientRect();
  var x=r.left-d.left+Math.min(r.width/2,64), y=r.top-d.top+r.height/2;
  cur.classList.add('vis');
  cur.style.transform='translate('+x+'px,'+y+'px)';
}
function ripple(){cur.classList.remove('click','down');void cur.offsetWidth;cur.classList.add('click','down');setTimeout(function(){cur.classList.remove('down')},160)}
function press(sel,tMove,after){
  at(tMove,function(){moveTo(q(sel))});
  at(tMove+950,function(){ripple();var e=q(sel);if(e)e.classList.add('pressed');if(after)after();
    var e2=q(sel);if(e2)setTimeout(function(){e2.classList.remove('pressed')},180);
    if(!e2||!e2.offsetParent)setTimeout(function(){hand(false)},120)}); /* target gone after the click: back to the arrow */
}
function node(n,icon,t,s,extra,id){return '<div class="node rv'+(extra||'')+'" data-a="'+n+'"'+(id?' id="'+id+'"':'')+'><span class="tile"><span class="ms">'+icon+'</span></span><span><b>'+t+'</b>'+(s?'<i>'+s+'</i>':'')+'</span></div>'}

/* ---------- bows (Line Bridge): drawn between cards, recomputed on every resize ---------- */
var bowDefs=[],bowEls=[];
function box(el){var x=0,y=0,e=el;while(e&&e!==cv){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return {l:x,t:y,r:x+el.offsetWidth,b:y+el.offsetHeight,cy:y+el.offsetHeight/2,w:el.offsetWidth}}
var K=0.5523;
function bowPath(a,z,kind){
  if(kind==='left'||kind==='right'){
    var left=kind==='left',x=left?Math.min(a.l,z.l):Math.max(a.r,z.r),y0=a.cy,y1=z.cy,h=y1-y0,dx=Math.min(40,h*0.55)*(left?-1:1),mid=(y0+y1)/2;
    return {d:'M'+x+' '+y0+' C'+(x+dx*K)+' '+y0+' '+(x+dx)+' '+(mid-h/2*K)+' '+(x+dx)+' '+mid+' S'+(x+dx*K)+' '+y1+' '+x+' '+y1,p:[[x,y0],[x,y1]],g:'gV'};
  }
  var inset=a.w*0.26,x1=a.r-inset,x2=z.l+inset,down=kind==='down',y=down?a.b:a.t,rx=(x2-x1)/2,cx=x1+rx,dep=Math.min(68,(x2-x1)*0.545)*(down?1:-1);
  return {d:'M'+x1+' '+y+' C'+x1+' '+(y+dep*K)+' '+(cx-rx*K)+' '+(y+dep)+' '+cx+' '+(y+dep)+' S'+x2+' '+(y+dep*K)+' '+x2+' '+y,p:[[x1,y],[x2,y]],g:down?'gD':'gU'};
}
function buildBows(){
  var was=bowEls.map(function(g){return g.classList.contains('on')});
  bowsSvg.innerHTML='';bowEls=[];
  bowDefs.forEach(function(b,i){
    var a=q(b[0]),z=q(b[1]);if(!a||!z)return;
    var kind=b[2];
    if(kind==='row'){var fl=a.parentNode;kind=getComputedStyle(fl).flexDirection==='column'?(i%2?'right':'left'):(i%2?'up':'down')}
    var s=bowPath(box(a),box(z),kind);
    var NS='http://www.w3.org/2000/svg',g=document.createElementNS(NS,'g');g.setAttribute('class','bow');
    var p=document.createElementNS(NS,'path');p.setAttribute('d',s.d);p.setAttribute('stroke','url(#'+s.g+')');g.appendChild(p);
    s.p.forEach(function(pt){var r=document.createElementNS(NS,'rect');r.setAttribute('x',pt[0]-3);r.setAttribute('y',pt[1]-3);r.setAttribute('width',6);r.setAttribute('height',6);g.appendChild(r)});
    bowsSvg.appendChild(g);
    var len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=was[i]?0:len;
    if(was[i])g.classList.add('on');
    bowEls[i]=g;
  });
}
function bowOn(i,ms){at(ms,function(){var g=bowEls[i];if(!g)return;g.classList.add('on');g.querySelector('path').style.strokeDashoffset=0})}

var ROW=[['#n1','#n2','row'],['#n2','#n3','row'],['#n3','#n4','row']];

var STEPS=[
{tab:'Build',sub:'Say it, it is built',dur:9500,

  +'<div class="pair">'+node(4,'confirmation_number','Jira','Create ticket','','n4')+node(5,'tag','Slack','Post to #sales','','n5')+'</div></div>'

  on(9,5000);on(10,5600);on(11,6200);

 }},
{tab:'Test',sub:'The schemas find themselves',dur:10800,bows:ROW,
 html:function(){return '<div class="scene-in s-test" style="display:flex;flex-direction:column;flex:1">'
  +'<div class="toprow"><div class="seg surface right" id="seg"><span class="slab"></span><span class="o" id="o1"><b>Simulate</b><span>Mock data, no real calls</span></span><span class="o on" id="o2"><b>Dry run</b><span>Real, read-only</span></span></div>'
  +'<span class="ybtn" id="run"><span class="ms">play_arrow</span>Dry run</span></div>'
  +'<div class="flow">'+node(1,'shopping_cart','Order in','',' on','n1')+node(2,'swap_horiz','Mapper','',' on','n2')+node(3,'confirmation_number','Jira call','',' on','n3')+node(4,'tag','Slack','',' on','n4')+'</div>'
  +'<div class="tpanel surface rv" data-a="9"><div class="phead"><div class="tabs"><span>Properties</span><span>Payload</span><span class="act">Schema</span></div><span class="sv"><span class="label rv" data-a="12"><span class="ms">check</span>Saved with the flow</span></span></div>'

  press('#run',1700,function(){setState('Running','neutral',0)});

 }},
{tab:'Govern',sub:'Rules checked before go-live',dur:10600,bows:[],
 html:function(){return '<div class="govern">'
  +'<div class="score"><svg viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="52" fill="none" stroke="rgba(249,249,249,.12)" stroke-width="6"/>'
  +'<circle class="fg" id="rg" cx="56" cy="56" r="52" fill="none" stroke="#FEF600" stroke-width="6" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 56 56)"/></svg><b id="rt">0/4</b></div>'
  +'<div class="rules">'
  +'<div class="rule surface rv" data-a="1"><span class="ck"><span class="ms">check</span></span><span class="rt"><span class="tt"><b>Every flow has error handling</b></span></span></div>'
  +'<div class="rule surface rv" data-a="2"><span class="ck"><span class="ms">check</span></span><span class="rt"><span class="tt"><b>Every flow has a retry policy</b></span></span></div>'
  +'<div class="rule surface rv" data-a="3"><span class="ck"><span class="ms" id="c3">check</span></span><span class="rt"><span class="tt"><b>Naming convention</b></span><span class="sg" id="s3">Step “Mapper” does not follow it. Suggested fix: “Map deal to ticket”</span></span><span class="ybtn" id="fx3">Apply</span></div>'
  +'<div class="rule surface rv" data-a="4"><span class="ck"><span class="ms" id="c4">check</span></span><span class="rt"><span class="tt"><b>Send only what is needed</b><span class="label">AI · Performance</span></span><span class="sg" id="s4">Mapper passes the whole customer record on. Suggested fix: send only the fields Jira needs.</span></span><span class="ybtn" id="fx4">Apply</span></div>'
  +'</div>'
  +'<span class="ybtn golive rv" id="gl" data-a="9"><span class="ms">rocket_launch</span>Ready to go live</span>'
  +'</div>'},
 play:function(){
  setState('Checking','neutral',0);
  function ring(n,ms){at(ms,function(){var c=q('#rg'),t=q('#rt');if(c)c.style.strokeDashoffset=String(326.7*(1-n/4));if(t)t.textContent=n+'/4'})}
  function fix(i,txt){var r=q(A(i)),c=q('#c'+i),sg=q('#s'+i),b=q('#fx'+i);if(r){r.classList.remove('bad');r.classList.add('chk')}if(c)c.textContent='check';if(sg)sg.textContent=txt;if(b)b.style.display='none'}
  function flag(i){var r=q(A(i)),c=q('#c'+i);if(r)r.classList.add('bad');if(c)c.textContent='priority_high'}
  on(1,300);on(2,600);on(3,900);on(4,1200);
  cls(1,'chk',900);ring(1,900);cls(2,'chk',1300);ring(2,1300);
  at(1900,function(){flag(3)});at(2400,function(){flag(4)});
  setState('2 findings','bad',2400);
  press('#fx3',3200,function(){fix(3,'Renamed to “Map deal to ticket”');ring(3,0)});
  press('#fx4',5200,function(){fix(4,'Mapper now sends only the fields Jira needs.');ring(4,0);setState('All checks pass','ok',0)});
  on(9,7200);
  press('#gl',7800,function(){setState('Live','ok',0)});
 }},
{tab:'Self-healing',sub:'Watch it run, see it heal',dur:12800,bows:ROW,
 html:function(){return '<div class="heal">'
  +'<div class="flow">'+node(1,'shopping_cart','Order in','','','n1')+node(2,'swap_horiz','Mapper','','','n2')
  +'<div class="node rv" data-a="3" id="n3"><span class="flag" id="hb">503</span><span class="tile"><span class="ms">confirmation_number</span></span><span><b>Jira call</b></span></div>'
  +node(4,'tag','Slack','','','n4')+'</div>'
  +'<div class="bubble surface rv" data-a="5"><div class="who"><span class="ms">auto_awesome</span>AI</div><p id="l1"></p><p id="l2"></p><span class="ybtn rv" id="ap" data-a="6">Apply: retry 3 times</span></div>'
  +'<div class="trace surface rv" data-a="7"><span class="ch">Live trace</span>'
  +'<div class="tr"><span>Order in</span><span class="tb"><i class="g" data-w="9%" style="left:0"></i></span></div>'
  +'<div class="tr"><span>Mapper</span><span class="tb"><i class="g" data-w="9%" style="left:9%"></i></span></div>'
  +'<div class="tr"><span>Jira call</span><span class="tb"><i class="r" data-w="11%" style="left:18%"></i><i class="r" data-w="11%" style="left:32%"></i><i class="r" data-w="11%" style="left:46%"></i><i class="g" data-w="12%" style="left:60%"></i></span></div>'
  +'<div class="tr"><span>Slack</span><span class="tb"><i class="g" data-w="12%" style="left:76%"></i></span></div></div>'
  +'<div class="labels"><span class="label rv" data-a="8"><span class="ms">check</span>Retried 2 times, then succeeded</span><span class="label rv" data-a="9">No one had to step in</span></div>'
  +'</div>'},
 play:function(){

  var L1='Jira answered 503, so it was briefly unavailable. Nothing is wrong in your flow.',L2='Suggested fix: retry this step 3 times, 5 seconds apart.';
  setState('Running','neutral',0);
  on(1,300);bowOn(0,450);on(2,600);bowOn(1,750);on(3,900);bowOn(2,1050);on(4,1200);on(7,1400);
  cls(1,'ok',1600);grow(0,1600);cls(2,'ok',2100);grow(1,2100);
  jn('bad',false,2800);grow(2,2800);jb('503','',2800);setState('Failed','bad',2800);
  on(5,3500);typeInto('#l1',L1,3700,18);typeInto('#l2',L2,3700+L1.length*18+200,18);
  var tEnd=3700+(L1.length+L2.length)*18+400;
  on(6,tEnd);
  press('#ap',tEnd+400,function(){jn('bad',true,0);jn('ok',false,0);jb('retry ×3','good',0);setState('Fix applied','ok',0)});
  jn('ok',true,8200);jn('bad',false,8200);jb('retry 1/3','',8200);grow(3,8200);setState('Retrying by itself','bad',8200);
  jb('retry 2/3','',9100);grow(4,9100);
  jn('bad',true,10000);jn('ok',false,10000);jb('healed','good',10000);grow(5,10000);setState('Healed','ok',10000);

 }}
];

/* step cards: badge + progress ring (a rounded square path that starts top-centre and runs clockwise) */
var RING='M20 1H28A11 11 0 0 1 39 12V28A11 11 0 0 1 28 39H12A11 11 0 0 1 1 28V12A11 11 0 0 1 12 1Z';
STEPS.forEach(function(s,i){
  var d=document.createElement('button');
  d.type='button';d.className='step';d.setAttribute('role','tab');
  d.innerHTML='<span class="bw"><span class="badge">'+(i+1)+'</span><svg class="ring-t" viewBox="0 0 40 40" aria-hidden="true"><path class="trk" d="'+RING+'"/><path class="prg" pathLength="100" d="'+RING+'"/></svg></span>'
    +'<span class="tx"><span class="t">'+s.tab+'</span><span class="s">'+s.sub+'</span></span>';
  d.addEventListener('click',function(){jump(i)});
  stepsEl.appendChild(d);
});
var stepEls=stepsEl.children;
function activate(i){
  idx=i;
  for(var k=0;k<stepEls.length;k++){
    var e=stepEls[k];e.classList.remove('act','done');e.setAttribute('aria-selected','false');
    e.querySelector('.badge').innerHTML=k<i?'<span class="ms">check</span>':String(k+1);
    if(k<i)e.classList.add('done');
    var p=e.querySelector('.prg');p.style.transition='none';p.style.strokeDashoffset='100';
  }
  var el=stepEls[i];el.classList.add('act');el.setAttribute('aria-selected','true');
  var prg=el.querySelector('.prg');
  if(!paused&&!REDUCED){void prg.getBoundingClientRect();prg.style.transition='stroke-dashoffset '+STEPS[i].dur+'ms linear';prg.style.strokeDashoffset='0'}
  else{prg.style.strokeDashoffset='0'}
  var s=STEPS[i];
  scene.innerHTML=s.html();
  scene.className='scene'+(i===1?' s-test':'');
  bowEls=[];bowDefs=s.bows;buildBows();
  s.play();
  if(!paused&&!REDUCED){at(s.dur,function(){go((i+1)%STEPS.length)})}
}
function go(i){clearAll();moveTo(stepEls[i]);at(900,function(){ripple();activate(i)})}
function jump(i){clearAll();hand(false);cur.classList.remove('vis');activate(i)}
function setPP(){$('#ppI').textContent=paused?'play_arrow':'pause';$('#ppT').textContent=paused?'Play':'Pause'}
pp.addEventListener('click',function(){
  paused=!paused;setPP();
  if(paused){clearAll();cur.classList.remove('vis');var p=stepEls[idx]&&stepEls[idx].querySelector('.prg');if(p){p.style.transition='none';p.style.strokeDashoffset='0'}}
  else{go(idx<0?0:(idx+1)%STEPS.length)}
});
/* bows follow the layout: rebuild whenever the window changes size */
if(window.ResizeObserver){new ResizeObserver(function(){if(bowDefs.length)buildBows()}).observe(cv)}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
  if(REDUCED){paused=true;pp.style.display='none';jump(STILL?STILL-1:0)}else{activate(0)}
});
})();
</script>
